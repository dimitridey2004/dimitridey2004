<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
<defs>
<style>
@keyframes fly{0%{transform:translateX(-30px)}50%{transform:translateX(35px)}100%{transform:translateX(-30px)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes scan{0%{transform:translateX(-260px);opacity:0}20%{opacity:.7}80%{opacity:.7}100%{transform:translateX(900px);opacity:0}}
@keyframes fill{0%{opacity:.25}50%{opacity:1}100%{opacity:.25}}
text{font-family:Consolas,'Liberation Mono',monospace}
</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b14"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<linearGradient id="nebula" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#58a6ff" stop-opacity="0"/><stop offset=".5" stop-color="#7ee787" stop-opacity=".18"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="900" height="360" rx="12" fill="url(#bg)" stroke="#30363d"/>
<rect x="1" y="1" width="898" height="34" rx="12" fill="#161b22"/><line x1="0" y1="35" x2="900" y2="35" stroke="#30363d"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<text x="450" y="22" text-anchor="middle" font-size="11" fill="#6e7681">dimitridey2004@github: ~/space-contribution-game</text>
<g fill="#e6edf3" font-size="11"><text x="22" y="58" fill="#7ee787">❯</text><text x="40" y="58">./launch.sh --mission="CONTRIBUTIONS"</text><text x="690" y="58" fill="#7ee787">[ ONLINE ]</text></g>
<rect x="18" y="70" width="864" height="1" fill="#30363d"/>
<g fill="#e6edf3"><text x="24" y="94" font-size="13" fill="#7ee787">MISSION CONTROL</text><text x="24" y="113" font-size="10" fill="#8b949e">Turn your GitHub activity into fuel. Every contribution powers the ship.</text></g>
<!-- stars -->
<g fill="#e6edf3" filter="url(#glow)"><circle cx="115" cy="145" r="1.5"/><circle cx="180" cy="175" r="1"/><circle cx="260" cy="132" r="1.2"/><circle cx="350" cy="160" r="1"/><circle cx="440" cy="135" r="1.4"/><circle cx="540" cy="175" r="1"/><circle cx="640" cy="135" r="1.2"/><circle cx="760" cy="165" r="1.5"/><circle cx="820" cy="125" r="1"/></g>
<g fill="#58a6ff"><circle cx="150" cy="150" r="1" style="animation:twinkle 2.1s infinite"/><circle cx="320" cy="185" r="1.5" style="animation:twinkle 1.7s infinite"/><circle cx="700" cy="145" r="1" style="animation:twinkle 2.5s infinite"/></g>
<!-- planet -->
<g transform="translate(785 145)" filter="url(#glow)"><circle r="31" fill="#101a2b" stroke="#58a6ff" stroke-width="1.5"/><ellipse rx="45" ry="10" fill="none" stroke="#58a6ff" stroke-opacity=".45"/><path d="M-16 -18 Q0 -8 16 -18 M-22 0 Q0 10 22 0 M-14 18 Q0 8 14 18" fill="none" stroke="#7ee787" stroke-opacity=".4"/></g>
<!-- spaceship -->
<g transform="translate(365 165)" style="animation:fly 4s ease-in-out infinite" filter="url(#glow)"><path d="M0-18 L48 0 L0 18 L10 0 Z" fill="#7ee787"/><path d="M8-10 L8 10 L-20 22 L-9 0 L-20-22 Z" fill="#58a6ff"/><circle cx="15" cy="0" r="4" fill="#e6edf3"/><path d="M-20-5 L-42 0 L-20 5" fill="none" stroke="#f0883e" stroke-width="3"/><path d="M-28-2 L-55 0 L-28 2" fill="none" stroke="#7ee787" stroke-width="2" style="animation:pulse 1s infinite"/></g>
<path d="M30 205 Q450 145 870 205" fill="none" stroke="url(#nebula)" stroke-width="18" opacity=".5"/>
<!-- contribution fuel grid -->
<g transform="translate(25 220)"><text x="0" y="0" font-size="10" fill="#8b949e">CONTRIBUTION FUEL CELLS</text><text x="780" y="0" font-size="10" fill="#7ee787">LOW ◼ ◼ ◼ ◼ HIGH</text>
<g transform="translate(0 15)">
<g fill="#161b22">
<rect x="0" y="0" width="14" height="14"/><rect x="20" y="0" width="14" height="14"/><rect x="40" y="0" width="14" height="14"/><rect x="60" y="0" width="14" height="14"/><rect x="80" y="0" width="14" height="14"/><rect x="100" y="0" width="14" height="14"/><rect x="120" y="0" width="14" height="14"/><rect x="140" y="0" width="14" height="14"/><rect x="160" y="0" width="14" height="14"/><rect x="180" y="0" width="14" height="14"/><rect x="200" y="0" width="14" height="14"/><rect x="220" y="0" width="14" height="14"/><rect x="240" y="0" width="14" height="14"/><rect x="260" y="0" width="14" height="14"/><rect x="280" y="0" width="14" height="14"/><rect x="300" y="0" width="14" height="14"/><rect x="320" y="0" width="14" height="14"/><rect x="340" y="0" width="14" height="14"/><rect x="360" y="0" width="14" height="14"/><rect x="380" y="0" width="14" height="14"/><rect x="400" y="0" width="14" height="14"/><rect x="420" y="0" width="14" height="14"/><rect x="440" y="0" width="14" height="14"/><rect x="460" y="0" width="14" height="14"/><rect x="480" y="0" width="14" height="14"/><rect x="500" y="0" width="14" height="14"/><rect x="520" y="0" width="14" height="14"/><rect x="540" y="0" width="14" height="14"/><rect x="560" y="0" width="14" height="14"/><rect x="580" y="0" width="14" height="14"/><rect x="600" y="0" width="14" height="14"/><rect x="620" y="0" width="14" height="14"/><rect x="640" y="0" width="14" height="14"/><rect x="660" y="0" width="14" height="14"/><rect x="680" y="0" width="14" height="14"/><rect x="700" y="0" width="14" height="14"/><rect x="720" y="0" width="14" height="14"/><rect x="740" y="0" width="14" height="14"/><rect x="760" y="0" width="14" height="14"/><rect x="780" y="0" width="14" height="14"/><rect x="800" y="0" width="14" height="14"/><rect x="820" y="0" width="14" height="14"/></g>
<g fill="#7ee787" opacity=".8">
<rect x="20" y="0" width="14" height="14"/><rect x="80" y="0" width="14" height="14"/><rect x="140" y="0" width="14" height="14"/><rect x="200" y="0" width="14" height="14"/><rect x="260" y="0" width="14" height="14"/><rect x="320" y="0" width="14" height="14"/><rect x="380" y="0" width="14" height="14"/><rect x="440" y="0" width="14" height="14"/><rect x="500" y="0" width="14" height="14"/><rect x="560" y="0" width="14" height="14"/><rect x="620" y="0" width="14" height="14"/><rect x="680" y="0" width="14" height="14"/><rect x="740" y="0" width="14" height="14"/><rect x="800" y="0" width="14" height="14"/></g>
<g fill="#58a6ff" opacity=".8"><rect x="40" y="0" width="14" height="14"/><rect x="100" y="0" width="14" height="14"/><rect x="180" y="0" width="14" height="14"/><rect x="240" y="0" width="14" height="14"/><rect x="300" y="0" width="14" height="14"/><rect x="360" y="0" width="14" height="14"/><rect x="420" y="0" width="14" height="14"/><rect x="480" y="0" width="14" height="14"/><rect x="540" y="0" width="14" height="14"/><rect x="600" y="0" width="14" height="14"/><rect x="660" y="0" width="14" height="14"/><rect x="720" y="0" width="14" height="14"/><rect x="780" y="0" width="14" height="14"/><rect x="840" y="0" width="14" height="14"/></g>
</g></g>
<rect class="scan" x="0" y="70" width="250" height="1" fill="#7ee787" opacity=".35" style="animation:scan 4s linear infinite"/>
<text x="25" y="318" font-size="10" fill="#8b949e">MISSION: KEEP SHIPPING</text><text x="450" y="318" text-anchor="middle" font-size="10" fill="#58a6ff">SHIP STATUS :: IN ORBIT</text><text x="875" y="318" text-anchor="end" font-size="10" fill="#7ee787">[ SPACE MODE: ON ]</text>
</svg>