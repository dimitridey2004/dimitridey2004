<svg xmlns="http://www.w3.org/2000/svg" width="850" height="250" viewBox="0 0 850 250">
<defs>
<style>
@keyframes scan{0%{transform:translateY(-230px);opacity:0}20%{opacity:.35}80%{opacity:.35}100%{transform:translateY(230px);opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes blink{0%,45%,100%{opacity:1}50%,95%{opacity:.15}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 1px #7ee787)}50%{filter:drop-shadow(0 0 7px #7ee787)}}
@keyframes load{from{width:0}to{width:150px}}
text{font-family:Consolas,'Liberation Mono',monospace}.bg{fill:#0d1117}.panel{fill:#111820;stroke:#30363d}.green{fill:#7ee787}.muted{fill:#8b949e}.blue{fill:#58a6ff}.orange{fill:#f0883e}.line{stroke:#30363d}.scan{animation:scan 5s linear infinite}.pulse{animation:pulse 1.8s ease-in-out infinite}.blink{animation:blink 1s step-end infinite}.glow{animation:glow 3s ease-in-out infinite}.load{animation:load 2.5s ease-out .6s both}
</style>
<clipPath id="clip"><rect x="1" y="1" width="848" height="248" rx="12"/></clipPath>
</defs>
