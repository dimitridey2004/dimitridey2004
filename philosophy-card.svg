<svg xmlns="http://www.w3.org/2000/svg" width="850" height="190" viewBox="0 0 850 190"><defs><style>@keyframes glow{0%,100%{opacity:.3}50%{opacity:1}}@keyframes scan{from{transform:translateX(-180px);opacity:0}20%{opacity:.7}to{transform:translateX(900px);opacity:0}}@keyframes blink{50%{opacity:0}}text{font-family:Consolas,'Liberation Mono',monospace}.g{animation:glow 2s infinite}.scan{animation:scan 4s linear infinite}.cur{animation:blink 1s step-end infinite}</style></defs><rect width="850" height="190" rx="12" fill="#0d1117" stroke="#30363d"/><rect x="1" y="1" width="848" height="4" rx="2" fill="#bc8cff" opacity=".8"/><circle cx="22" cy="25" r="5" fill="#ff5f57"/><circle cx="40" cy="25" r="5" fill="#febc2e"/><circle cx="58" cy="25" r="5" fill="#28c840"/><text x="78" y="29" font-size="11" fill="#6e7681">PHILOSOPHY.TXT</text><text x="756" y="29" font-size="10" fill="#bc8cff">CORE</text><line x1="22" y1="48" x2="828" y2="48" stroke="#30363d"/><rect class="scan" x="22" y="47" width="160" height="3" fill="#bc8cff"/><text x="28" y="77" font-size="12" fill="#7ee787">$ cat philosophy.txt</text><text x="32" y="105" font-size="12" fill="#58a6ff">01</text><text x="72" y="105" font-size="12" fill="#e6edf3">Keep it simple.</text><text x="32" y="128" font-size="12" fill="#58a6ff">02</text><text x="72" y="128" font-size="12" fill="#e6edf3">Build with purpose.</text><text x="32" y="151" font-size="12" fill="#58a6ff">03</text><text x="72" y="151" font-size="12" fill="#e6edf3">Prefer clean interfaces.</text><text x="32" y="174" font-size="12" fill="#58a6ff">04</text><text x="72" y="174" font-size="12" fill="#e6edf3">Learn by shipping.</text><text x="330" y="105" font-size="12" fill="#58a6ff">05</text><text x="370" y="105" font-size="12" fill="#e6edf3">Improve what already works.</text><text class="g" x="780" y="170" font-size="12" fill="#bc8cff">●</text></svg>