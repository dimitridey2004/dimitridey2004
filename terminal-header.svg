<svg xmlns="http://www.w3.org/2000/svg" width="850" height="310" viewBox="0 0 850 310">
  <defs>
    <style>
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes fadeIn { from{opacity:0} to{opacity:1} }
      @keyframes slideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
      @keyframes portraitGlow { 0%,100%{filter:drop-shadow(0 0 1px rgba(126,231,135,.15))} 50%{filter:drop-shadow(0 0 6px rgba(126,231,135,.65))} }
      @keyframes scan { from{transform:translateY(0);opacity:.05} 50%{opacity:.22} to{transform:translateY(188px);opacity:.05} }
      text { font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,Courier,monospace; }
      .term-bg{fill:#0d1117}.term-border{fill:none;stroke:#30363d;stroke-width:1}.titlebar{fill:#161b22}.titlebar-line{stroke:#30363d;stroke-width:.5}
      .dot-red{fill:#ff5f57}.dot-yellow{fill:#febc2e}.dot-green{fill:#28c840}
      .title-text{font-size:11px;fill:#6e7681}.prompt-sym{font-size:12px;fill:#7ee787}.cmd-text{font-size:12px;fill:#e6edf3}.portrait-cmd{font-size:9px;fill:#e6edf3}
      .art{font-size:11px;fill:#58a6ff}.tagline{font-size:12px;fill:#8b949e}.accent{font-size:12px;fill:#f0883e}.sep{font-size:12px;fill:#484f58}.cursor-block{fill:#7ee787;animation:blink 1s step-end infinite}
      .portrait-art{font-size:4.15px;fill:#7ee787}
      .s0{opacity:0;animation:slideUp .6s ease-out .2s forwards}.s1{opacity:0;animation:fadeIn .4s ease-out .6s forwards}.s2{opacity:0;animation:fadeIn .4s ease-out .75s forwards}.s3{opacity:0;animation:fadeIn .4s ease-out .9s forwards}.s4{opacity:0;animation:fadeIn .4s ease-out 1.05s forwards}.s5{opacity:0;animation:fadeIn .4s ease-out 1.2s forwards}.s6{opacity:0;animation:fadeIn .4s ease-out 1.35s forwards}.s7{opacity:0;animation:fadeIn .4s ease-out 1.5s forwards}.s8{opacity:0;animation:fadeIn .4s ease-out 1.65s forwards}.s12{opacity:0;animation:slideUp .6s ease-out 2.4s forwards}.s13{opacity:0;animation:slideUp .6s ease-out 2.7s forwards}.s14{opacity:0;animation:fadeIn .5s ease-out 3s forwards}
      .portrait-glow{animation:portraitGlow 4s ease-in-out 2s infinite}
      .pa1,.pa2,.pa3,.pa4,.pa5,.pa6,.pa7,.pa8,.pa9,.pa10,.pa11,.pa12,.pa13,.pa14,.pa15,.pa16,.pa17,.pa18,.pa19,.pa20,.pa21,.pa22,.pa23,.pa24,.pa25,.pa26,.pa27,.pa28,.pa29,.pa30,.pa31,.pa32,.pa33,.pa34,.pa35,.pa36,.pa37{opacity:0;animation:fadeIn .22s ease-out forwards}
      .pa1{animation-delay:.20s}.pa2{animation-delay:.25s}.pa3{animation-delay:.30s}.pa4{animation-delay:.35s}.pa5{animation-delay:.40s}.pa6{animation-delay:.45s}.pa7{animation-delay:.50s}.pa8{animation-delay:.55s}.pa9{animation-delay:.60s}.pa10{animation-delay:.65s}.pa11{animation-delay:.70s}.pa12{animation-delay:.75s}.pa13{animation-delay:.80s}.pa14{animation-delay:.85s}.pa15{animation-delay:.90s}.pa16{animation-delay:.95s}.pa17{animation-delay:1.00s}.pa18{animation-delay:1.05s}.pa19{animation-delay:1.10s}.pa20{animation-delay:1.15s}.pa21{animation-delay:1.20s}.pa22{animation-delay:1.25s}.pa23{animation-delay:1.30s}.pa24{animation-delay:1.35s}.pa25{animation-delay:1.40s}.pa26{animation-delay:1.45s}.pa27{animation-delay:1.50s}.pa28{animation-delay:1.55s}.pa29{animation-delay:1.60s}.pa30{animation-delay:1.65s}.pa31{animation-delay:1.70s}.pa32{animation-delay:1.75s}.pa33{animation-delay:1.80s}.pa34{animation-delay:1.85s}.pa35{animation-delay:1.90s}.pa36{animation-delay:1.95s}.pa37{animation-delay:2.00s}
    </style>
    <filter id="termGlow" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="portraitBlur" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation=".55" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="rightPanel"><rect x="592" y="62" width="248" height="220"/></clipPath>
